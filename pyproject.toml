[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logic-platform"
version = "0.1.0"
description = "Local survey logic extraction and Fairset review platform"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "pyreadstat>=1.2.0",
  "python-docx>=1.0.0",
  "python-dotenv>=1.0.0",
  "pandas>=2.0.0",
  "google-genai>=1.0.0",
  "anthropic[vertex]>=0.39.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = [
  "ignore:.*urllib3.*:Warning",
  "ignore::requests.exceptions.RequestsDependencyWarning",
  "ignore:.*urllib3.*doesn't match a supported version.*:requests.exceptions.RequestsDependencyWarning",
]
